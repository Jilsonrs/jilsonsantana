# Configurações não-secretas do serviço de produção no Google Cloud Run (Bloco G).
# Formato YAML — é o que o `--env-vars-file` do gcloud lê (o formato CHAVE=valor faria a
# publicação falhar). Chave nenhuma vive aqui: segredos moram no Secret Manager (CLAUDE.md).

NODE_ENV: "production"
# PORT NÃO entra aqui: é reservado pelo Cloud Run, que o define sozinho (8080) e recusa a
# publicação se ele aparecer; o servidor já lê process.env.PORT.
BETTER_AUTH_URL: "https://www.jilsonsantana.com"
# O endereço do site nas páginas públicas (canonical, Open Graph, sitemap) — server/src/routes/home.ts.
BASE_URL: "https://www.jilsonsantana.com"
COMING_SOON: "true"
# A venda SEM LOGIN (etapa 4.7), ligada antes da abertura por decisão do operador (27/10/2026): com o
# "Em breve" no ar só ele vê a home e a tela de assinar, e testa a compra no site. Desligada, as rotas
# /api/billing/visitante/* respondem 404. O risco aceito: billing.md → Assinar sem conta.
ASSINAR_SEM_LOGIN: "true"
# O PIX PRÉ-PAGO (etapa 4.9): a configuração de formas de pagamento SÓ COM PIX da conta de verdade,
# criada pelo operador no painel em 28/10/2026 (P109). Não é segredo. Sem ela, as rotas do Pix
# respondem 503 e a tela não oferece o Pix. A da área restrita fica no server/.env.
STRIPE_PIX_CONFIGURATION: "pmc_1UVbbJCb0IFa2F76AZ6JkqND"
BUNNY_STREAM_LESSONS_LIBRARY_ID: "762605"
# O CDN Hostname da jilsonsantana-stream (Bunny → Stream → API). O CI confere no próprio
# Bunny que ele existe (deploy/conferir-bunny.sh) — na G2 ele entrou errado, sem erro nenhum.
BUNNY_STREAM_LESSONS_CDN_HOST: "vz-6996efe9-374.b-cdn.net"
BUNNY_STORAGE_ZONE: "jilsonsantana-storage"
BUNNY_STORAGE_HOST: "br.storage.bunnycdn.com"
BUNNY_IMG_BASE_URL: "https://img.jilsonsantana.com"
BUNNY_FILES_STORAGE_ZONE: "jilsonsantana-arquivos"
BUNNY_FILES_STORAGE_HOST: "br.storage.bunnycdn.com"
