name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Typecheck, test & build
    runs-on: ubuntu-latest

    # Postgres efêmero, criado e destruído a cada run. Substituiu o projeto
    # Supabase de teste em Ago 2026 (CLAUDE.md → Database & Migrations): é mais
    # rápido (sem rede), é grátis, e ELIMINOU os secrets TEST_DATABASE_URL /
    # TEST_DIRECT_URL do repositório — connection string de nuvem guardada em
    # secret é superfície; `localhost` não é segredo nenhum.
    # A major (17) acompanha produção de propósito — ver a nota no plano sobre
    # divergência de runtime.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jilsonsantana_test
        ports:
          - 5432:5432
        # Sem o health check o step de teste corre antes de o banco aceitar
        # conexão, e falha com "can't reach database" que parece bug do código.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm --workspace @jilson/core run build

      - name: Typecheck client
        run: npm --workspace @jilson/client run typecheck

      # Mirrors Dockerfile:60-63 — server code imports @prisma/client, so tsc
      # fails on a fresh runner without the generated types. Needs no
      # DATABASE_URL: generate only reads the schema and writes to node_modules.
      # (CI lacked this while the Dockerfile had it — see implementation-plan
      # Bloco 0: dev CI was red for 5 commits because the two diverged.)
      - name: Generate Prisma client
        run: npm --workspace @jilson/server run db:generate

      - name: Typecheck server
        run: npm --workspace @jilson/server run typecheck

      # Runs after "Build core": the suites import @jilson/core, which resolves
      # to core/dist — absent in a fresh runner until that step has run.
      # E2E (Playwright) is deliberately NOT here: it needs a server + a test DB.
      - name: Test client
        run: npm --workspace @jilson/client run test

      # A suíte de servidor é FRONTEIRA (gate de acesso, webhook, auth): não tem
      # tela, então precisa de banco real. O .env.test não é versionado, então é
      # montado aqui — e agora SEM NENHUM SECRET de repositório: o banco é o
      # service container acima, em localhost, e todo segredo é EFÊMERO, gerado
      # no run. O globalSetup dá `migrate reset` antes de cada execução, então
      # nada aqui precisa sobreviver ao job; guardar em lugar nenhum é menos
      # superfície para vazar.
      #
      # A TRAVA do globalSetup exige host local — este `localhost` a satisfaz
      # pelo mesmo motivo que a máquina do operador: um banco em localhost não
      # pode ser o banco que o Railway serve.
      - name: Prepare server test env
        run: |
          umask 077
          cat > server/.env.test <<'STATIC'
          NODE_ENV=test
          BETTER_AUTH_URL=http://localhost:3000
          CLIENT_URL=http://localhost:5173
          SEED_ADMIN_EMAIL=admin@ci.local
          SEED_MEMBER_EMAIL=member@ci.local
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jilsonsantana_test
          DIRECT_URL=postgresql://postgres:postgres@localhost:5432/jilsonsantana_test
          STATIC
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "SEED_ADMIN_PASSWORD=$(openssl rand -base64 24)"
            echo "SEED_MEMBER_PASSWORD=$(openssl rand -base64 24)"
          } >> server/.env.test

      - name: Test server
        run: npm --workspace @jilson/server run test

      - name: Build client
        run: npm --workspace @jilson/client run build

      - name: Build server
        run: npm --workspace @jilson/server run build

      # Informative only — NEVER blocks the gate (CLAUDE.md → Quality Gates).
      # Expected to report findings today (transitive react-router advisory);
      # if it becomes permanent noise, it degrades to a monthly manual check.
      - name: Audit dependencies (informative)
        run: npm audit --audit-level=high
        continue-on-error: true
