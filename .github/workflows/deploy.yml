name: Deploy

# A publicação no Google Cloud Run (Bloco G, etapa G2 / G3):
# - Roda só na `main` e só DEPOIS de o CI terminar com sucesso (verde);
# - Entra no Google por Workload Identity Federation (WIF), sem chave guardada no GitHub;
# - Monta a imagem Docker e guarda no Artifact Registry;
# - Roda as migrations num Cloud Run Job com a mesma imagem (se falhar, não publica);
# - Só então atualiza o serviço no Cloud Run com a "conta mínima" do plano.

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: ["completed"]

# Duas publicações nunca correm juntas (dois merges seguidos): a segunda espera a primeira.
concurrency:
  group: publicar-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no Google Cloud Run
    # SÓ o CI de um ENVIO (push) à `main` DESTE repositório publica. O CI também roda em pull
    # request — inclusive de cópia (fork) feita por qualquer pessoa, porque o repositório é
    # público —, e o `head_branch` de um fork pode se chamar `main`: sem as duas conferências
    # abaixo, o código de um estranho seria montado e publicado com acesso ao cofre
    # (revisão do Claude, 22/10/2026). Não tire nenhuma das quatro condições.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Exigido pelo Workload Identity Federation (WIF)

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Autenticar no Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker no Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Montar e enviar imagem para o Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/app:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O PAPEL DO PRE-DEPLOY: roda as migrations num Cloud Run Job com a mesma imagem.
      # Se a migration falhar (exit code != 0), o step falha, a publicação é abortada
      # e o serviço em produção NÃO é atualizado.
      - name: Executar migrations no Cloud Run Job
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/app:${{ github.event.workflow_run.head_sha }}"
          gcloud run jobs update ${{ vars.GCP_MIGRATE_JOB_NAME }} \
            --image="$IMAGE" \
            --region="${{ vars.GCP_REGION }}" \
            --quiet
          gcloud run jobs execute ${{ vars.GCP_MIGRATE_JOB_NAME }} \
            --region="${{ vars.GCP_REGION }}" \
            --wait \
            --quiet

      # Só atualiza o serviço se as migrations rodaram com sucesso.
      # A configuração segue a "conta mínima" do Bloco G:
      # - região: us-east4
      # - de 1 a 3 cópias (min-instances 1, max-instances 3 — decisão do operador, 25/10/2026,
      #   depois do teste de carga: 1.000 alunos assistindo ≈ 3 cópias; o código já conta as
      #   tentativas e relê os textos no banco, então as cópias concordam entre si)
      # - até 160 pedidos ao mesmo tempo por cópia (o valor que já estava no serviço desde a G3)
      # - cobrança por pedido: --cpu-throttling
      # - 1 processador e 1 GB por cópia (decisão do operador, 25/10/2026: folga sobre os ~150–210 MB
      #   medidos, por ~US$ 3/mês a mais). TODAS as cópias têm o mesmo tamanho — o Cloud Run não
      #   deixa uma cópia maior que as outras
      # - tempo máximo do pedido: 3600 s (--timeout=3600)
      # - variáveis não-secretas pelo arquivo versionado deploy/cloud-run.yaml
      # - segredos por referência ao Secret Manager (--set-secrets)
      - name: Atualizar serviço no Cloud Run
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/app:${{ github.event.workflow_run.head_sha }}"
          gcloud run services update ${{ vars.GCP_SERVICE_NAME }} \
            --image="$IMAGE" \
            --region="${{ vars.GCP_REGION }}" \
            --min-instances=1 \
            --max-instances=3 \
            --concurrency=160 \
            --cpu=1 \
            --memory=1Gi \
            --cpu-throttling \
            --timeout=3600 \
            --env-vars-file=deploy/cloud-run.yaml \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:latest,PREVIEW_TOKEN=PREVIEW_TOKEN:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,BUNNY_ACCOUNT_API_KEY=BUNNY_ACCOUNT_API_KEY:latest,BUNNY_STREAM_LESSONS_API_KEY=BUNNY_STREAM_LESSONS_API_KEY:latest,BUNNY_STREAM_LESSONS_TOKEN_KEY=BUNNY_STREAM_LESSONS_TOKEN_KEY:latest,BUNNY_STORAGE_PASSWORD=BUNNY_STORAGE_PASSWORD:latest,BUNNY_FILES_STORAGE_PASSWORD=BUNNY_FILES_STORAGE_PASSWORD:latest \
            --quiet
